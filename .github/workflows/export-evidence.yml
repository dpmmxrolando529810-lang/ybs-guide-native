name: Export signed YBS evidence
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to export'
        type: string
        required: true
        default: 'source-v1.1.3'
      asset_name:
        description: 'Existing public asset filename'
        type: string
        required: true
        default: 'YBS-Guide-QA-v1.1.0.zip'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read existing public release asset
        env:
          GH_TOKEN: ${{ github.token }}
          YBS_TAG: ${{ inputs.release_tag }}
          YBS_ASSET: ${{ inputs.asset_name }}
        run: |
          mkdir export
          gh release download "$YBS_TAG" --pattern "$YBS_ASSET" --dir export --repo "$GITHUB_REPOSITORY"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          for p in list(Path('export').iterdir()):
              print(p.name,p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
              if p.name.startswith('YBS-Guide-QA-') and p.suffix=='.zip':
                  with zipfile.ZipFile(p) as z:
                      assert sum(x.file_size for x in z.infolist())<200*1024*1024
                      assert all(not Path(x.filename).is_absolute() and '..' not in Path(x.filename).parts for x in z.infolist())
                      z.extractall('export/contents')
          PY
      - name: Retain reviewable signed files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ybs-signed-evidence
          path: export/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
