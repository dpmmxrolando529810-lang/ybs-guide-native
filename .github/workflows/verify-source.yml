name: Verify YBS Android build

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Release containing the Source ZIP'
        type: string
        required: true
        default: 'v1.0.12'
      source_asset:
        description: 'Exact Source ZIP filename'
        type: string
        required: true
        default: 'YBS-Guide-Source-v1.0.12.zip'

permissions:
  contents: read

concurrency:
  group: ybs-guide-build-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out public source fetcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch and verify public Source ZIP
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          YBS_SOURCE_TAG: ${{ inputs.source_tag }}
          YBS_SOURCE_ASSET: ${{ inputs.source_asset }}
        shell: bash
        run: |
          python3 scripts/fetch_release_source.py \
            --release-tag "$YBS_SOURCE_TAG" \
            --asset-name "$YBS_SOURCE_ASSET"
      - name: Verify publisher and archive checks
        working-directory: ${{ steps.source.outputs.directory }}
        run: python3 -m unittest discover -s verification -p test_github_publisher.py -v
      - name: Install Android build dependencies
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile and verify native APK with temporary QA signer
        working-directory: ${{ steps.source.outputs.directory }}
        shell: bash
        run: |
          qa_dir="$RUNNER_TEMP/ybs-qa-signing"
          mkdir -m 700 "$qa_dir"
          trap 'rm -rf "$qa_dir"' EXIT
          printf '%s' 'ybs-temporary-ci-validation' > "$qa_dir/password.txt"
          chmod 600 "$qa_dir/password.txt"
          keytool -genkeypair -noprompt -storetype JKS \
            -keystore "$qa_dir/validation.jks" -alias ybs-guide \
            -storepass:file "$qa_dir/password.txt" -keypass:file "$qa_dir/password.txt" \
            -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=YBS temporary build verification'
          python3 scripts/build_native.py \
            --sdk "$ANDROID_HOME" \
            --keystore "$qa_dir/validation.jks" \
            --password-file "$qa_dir/password.txt" \
            --out "$RUNNER_TEMP/ybs-build-validation.apk"
          {
            echo 'Verified public Source ZIP, publisher tests, Android native compilation, APK signature and 16 KB ZIP alignment.'
            echo 'This verification uses a temporary QA signer. Production signing secrets are not accessed and no release is published.'
          } >> "$GITHUB_STEP_SUMMARY"
