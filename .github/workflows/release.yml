name: Publish YBS Android update

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'A new, unused APK version, such as 1.1.1'
        type: string
        required: true
        default: ''
      version_code:
        description: 'Leave empty to increase the version code automatically'
        type: string
        required: false
        default: ''
      source_tag:
        description: 'Prerelease containing the verified Source ZIP'
        type: string
        required: true
        default: 'source-v1.1.4'
      source_asset:
        description: 'Exact Source ZIP filename'
        type: string
        required: true
        default: 'YBS-Guide-Source-v1.1.4.zip'
      release_notes:
        description: 'Changes in this release'
        type: string
        required: false
        default: 'YBS Guide update'

permissions:
  contents: write

concurrency:
  group: ybs-guide-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check original signing configuration
        env:
          YBS_KEY_PRESENT: ${{ secrets.YBS_RELEASE_KEYSTORE_B64 != '' }}
          YBS_PASSWORD_PRESENT: ${{ secrets.YBS_RELEASE_PASSWORD != '' }}
        shell: bash
        run: |
          if [[ "$YBS_KEY_PRESENT" != "true" || "$YBS_PASSWORD_PRESENT" != "true" ]]; then
            echo '::error::Configure the original YBS signing key and signing password in encrypted Actions secrets before publishing.'
            exit 1
          fi
      - name: Check out publisher files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch and verify the Source ZIP
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          YBS_SOURCE_TAG: ${{ inputs.source_tag }}
          YBS_SOURCE_ASSET: ${{ inputs.source_asset }}
        shell: bash
        run: |
          python3 scripts/fetch_release_source.py \
            --release-tag "$YBS_SOURCE_TAG" \
            --asset-name "$YBS_SOURCE_ASSET"
      - name: Install Android build dependencies
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Write release notes
        env:
          YBS_NOTES: ${{ inputs.release_notes }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'ybs-release-notes.txt').write_text(os.environ['YBS_NOTES'], encoding='utf-8')
          PY
      - name: Build, stage, verify and publish
        working-directory: ${{ steps.source.outputs.directory }}
        env:
          GH_TOKEN: ${{ github.token }}
          YBS_RELEASE_KEYSTORE_B64: ${{ secrets.YBS_RELEASE_KEYSTORE_B64 }}
          YBS_RELEASE_PASSWORD: ${{ secrets.YBS_RELEASE_PASSWORD }}
          YBS_VERSION_NAME: ${{ inputs.version_name }}
          YBS_VERSION_CODE: ${{ inputs.version_code }}
        shell: bash
        run: |
          python3 scripts/publish_github_release.py \
            --version-name "$YBS_VERSION_NAME" \
            --version-code "$YBS_VERSION_CODE" \
            --notes-file "$RUNNER_TEMP/ybs-release-notes.txt"
